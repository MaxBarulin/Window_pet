name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The rig maths, animation and terrain logic are platform independent, so they
    # are tested here where it is cheap. Qt runs headless via the offscreen plugin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q
      - name: Check the rig rebuilds from the cached cutout
        run: |
          python tools/build_assets.py
          python tools/make_icon.py
          git diff --exit-code --stat assets/ || (
            echo "::error::assets/ is out of date - re-run tools/build_assets.py and commit"
            exit 1
          )
      - name: Render a preview of every animation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/render_preview.py --sheet clips.png --frames 8 --height 180
      - uses: actions/upload-artifact@v4
        with:
          name: animation-preview
          path: clips.png

  exe:
    name: Build WindowPet.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Build
        run: pyinstaller WindowPet.spec --noconfirm
      - name: Check the exe was produced
        shell: pwsh
        run: |
          $exe = "dist/WindowPet.exe"
          if (-not (Test-Path $exe)) { throw "no exe at $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "WindowPet.exe is $mb MB"
          if ($mb -lt 15) { throw "exe is suspiciously small ($mb MB) - assets likely missing" }
      - name: Smoke test - it starts, runs and exits cleanly
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/WindowPet.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            throw "WindowPet.exe exited on its own with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "ran for 20s without crashing"
      - uses: actions/upload-artifact@v4
        with:
          name: WindowPet-exe
          path: dist/WindowPet.exe
          if-no-files-found: error
