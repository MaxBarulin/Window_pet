name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The rig maths, animation and terrain logic are platform independent, so they
    # are tested here where it is cheap. Qt runs headless via the offscreen plugin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # `python -m` rather than the bare console script: it puts the working
        # directory on sys.path. pyproject.toml's pythonpath covers this too, but
        # this is the invocation the suite is developed against.
        run: python -m pytest tests/ -q
      - name: Check the rig rebuilds from the cached cutout
        run: |
          python tools/build_assets.py
          python tools/make_icon.py
          git diff --exit-code --stat assets/ || (
            echo "::error::assets/ is out of date - re-run tools/build_assets.py and commit"
            exit 1
          )
      - name: Render a preview of every animation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/render_preview.py --sheet clips.png --frames 8 --height 180
      - uses: actions/upload-artifact@v4
        with:
          name: animation-preview
          path: clips.png

  exe:
    name: Build WindowPet.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Confirm numpy is not installed
        # The runtime must not need it. Building without it present means an
        # accidental `import numpy` fails here rather than on a user's machine.
        shell: pwsh
        run: |
          pip uninstall -y numpy 2>$null | Out-Null
          $has = pip show numpy 2>$null
          if ($has) { throw "numpy is installed; the runtime must not depend on it" }
          Write-Host "numpy absent, as intended"

      - name: Build one-file
        run: pyinstaller WindowPet.spec --noconfirm --distpath dist-onefile
      - name: Build one-folder
        env:
          PET_ONEDIR: "1"
        run: pyinstaller WindowPet.spec --noconfirm --distpath dist-onedir --workpath build-onedir

      - name: Check both builds were produced
        shell: pwsh
        run: |
          $exe = "dist-onefile/WindowPet.exe"
          if (-not (Test-Path $exe)) { throw "no exe at $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "one-file WindowPet.exe is $mb MB"
          if ($mb -lt 10) { throw "exe is suspiciously small ($mb MB) - assets likely missing" }
          $dir = "dist-onedir/WindowPet/WindowPet.exe"
          if (-not (Test-Path $dir)) { throw "no exe at $dir" }
          Write-Host "one-folder build present"

      - name: Smoke test both - they start, run and exit cleanly
        shell: pwsh
        run: |
          foreach ($exe in @("dist-onefile/WindowPet.exe", "dist-onedir/WindowPet/WindowPet.exe")) {
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 20
            if ($p.HasExited) {
              # a startup failure leaves its full traceback here
              $log = Join-Path $env:APPDATA "WindowPet\crash.log"
              if (Test-Path $log) { Write-Host "--- crash.log ---"; Get-Content $log }
              throw "$exe exited on its own with code $($p.ExitCode)"
            }
            Stop-Process -Id $p.Id -Force
            Write-Host "$exe ran for 20s without crashing"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WindowPet-exe
          path: dist-onefile/WindowPet.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WindowPet-folder
          path: dist-onedir/WindowPet
          if-no-files-found: error
